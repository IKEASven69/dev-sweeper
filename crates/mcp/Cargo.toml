[package]
name = "dev-sweeper-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sweep-mcp"
path = "src/main.rs"

[dependencies]
dev-sweeper-core = { path = "../core" }
# 官方 Rust SDK（modelcontextprotocol/rust-sdk）。stable 工具链（1.97）拉取与
# 编译均顺利，采用它而非手写 JSON-RPC：initialize/tools 协议细节、schema 生成
# 与 framing 都交给 SDK，服务端只写工具逻辑。
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
serde.workspace = true
serde_json.workspace = true
schemars = "1"

[dev-dependencies]
tempfile = "3"
