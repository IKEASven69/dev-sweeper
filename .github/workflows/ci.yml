name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# 同分支新推送时取消正在跑的旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 三平台覆盖：unix-only 的 symlink/TOCTOU 测试靠 ubuntu/macos 跑
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (core 单测，含 unix-only 用例)
        run: cargo test -p dev-sweeper-core --verbose
      # 只编译 core + cli（不编译 Tauri 壳）——后者在 Linux 需 webview/glib 等系统库，
      # 完整打包交给 release 流程。core+cli 足以守护扫描/删除逻辑。
      - name: cargo build (core + cli)
        run: cargo build -p dev-sweeper-core -p dev-sweeper-cli --verbose

  frontend-check:
    name: tsc typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - name: TypeScript 类型检查
        run: pnpm exec tsc --noEmit
