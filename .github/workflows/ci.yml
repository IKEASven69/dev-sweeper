name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# 同分支新推送时取消正在跑的旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 三平台覆盖：unix-only 的 symlink/TOCTOU 测试靠 ubuntu/macos 跑
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (全 workspace，core+cli+mcp)
        run: cargo test --workspace --verbose
      # 只编译 core + cli + mcp（不编译 Tauri 壳）——后者在 Linux 需 webview/glib 等
      # 系统库，完整打包交给 release 流程。core+cli+mcp 足以守护扫描/删除逻辑。
      - name: cargo build (core + cli + mcp)
        run: cargo build -p dev-sweeper-core -p dev-sweeper-cli -p dev-sweeper-mcp --verbose
      # sweep-mcp 冒烟：--help 能跑通（真实拉起是 stdio 循环，CI 里不适合长驻）
      - name: sweep-mcp 冒烟（--help）
        run: cargo run -p dev-sweeper-mcp --bin sweep-mcp -- --help

  frontend-check:
    name: tsc typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: TypeScript 类型检查
        run: pnpm exec tsc --noEmit
      - name: locale 一致性检查（zh/en key 与占位符）
        run: node scripts/check-locales.mjs
